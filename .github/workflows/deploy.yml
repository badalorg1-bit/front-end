name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g @railway/cli
      - run: railway up -p 6e079c33-405d-4ee5-b122-10c64e6f4017 -s 0c8fcc6e-475d-4dab-b8e1-2a58fc16aa36 -e production -c
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
